<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lunari — Fuel (Ovulation) — static reference</title>

<!--
  ============================================================================
  lunari · Fuel screen · OVULATION phase — exact static reference
  ============================================================================
  Extracted verbatim from the "lunari Goddess" prototype. Prototype
  JS/interactivity stripped; markup + CSS only.

  TREATMENT — Fuel is a "LAB" screen (same as Move): phase-colored HEADER BAND
  on top + phase-TINTED body below (NOT a full flood). Gold linework,
  Marcellus/Raleway, frost cards throughout.

  PHASE THEME (Ovulation) — the values that change per phase:
    --header     linear-gradient(165deg,#F8DC97,#F3C566)
    --on-hdr     #3A2708   (text on header / on the solid target card — #F5EBD6 on dark phases)
    --on-hdr-sub #8A6420   (sub text on header — rgba(245,235,214,.72) on dark phases)
    --gold       #A8791E   (gold linework on this LIGHT phase; #C9A84C on dark phases)
    --solid      #E3A82E   (phase solid — focus labels + the protein-target card bg)
    --lab-bg     #F8F1DE   (tinted body background)
    --lab-card   #FDF9EE   (frost card fill)
    --lab-border #ECE1C8   (card border / meal dividers)

  Fixed neutrals (same on every phase):
    focus sub / section label #A99E88 · meal slot #BDB39D ·
    meal name #2C2825 · meal stat #6A655D

  Fonts: Marcellus (display) + Raleway (body).
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Raleway:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2a1f12;                  /* page backdrop only — not part of the screen */
    display: flex;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    font-family: 'Raleway', sans-serif;
  }

  /* ---- OVULATION phase theme variables ---- */
  .fuel {
    --header: linear-gradient(165deg, #F8DC97, #F3C566);
    --on-hdr: #3A2708;
    --on-hdr-sub: #8A6420;
    --gold: #A8791E;
    --solid: #E3A82E;
    --lab-bg: #F8F1DE;
    --lab-card: #FDF9EE;
    --lab-border: #ECE1C8;

    width: 390px;                         /* phone screen width (prototype frame inner ≈ 362) */
    min-height: 800px;
    border-radius: 40px;                  /* screen radius token */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--lab-bg);
  }

  /* ---- HEADER BAND (phase gradient) ---- */
  .fuel__header {
    background: var(--header);
    color: var(--on-hdr);
    padding: 14px 24px 22px;
    position: relative;
    overflow: hidden;
  }
  .fuel__header-orbit {
    position: absolute;
    right: -34px;
    top: -22px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    opacity: 0.25;
  }
  .fuel__status {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    position: relative;
  }
  .fuel__status .signal { font-size: 10px; }
  .fuel__context {
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-top: 16px;
    position: relative;
  }
  .fuel__title {
    font-family: 'Marcellus', serif;
    font-size: 30px;
    margin-top: 5px;
    position: relative;
  }
  .fuel__tagline {
    font-size: 12px;
    color: var(--on-hdr-sub);
    margin-top: 4px;
    font-weight: 300;
    position: relative;
  }

  /* ---- TINTED BODY ---- */
  .fuel__body { flex: 1; padding: 16px 22px 16px; }

  /* phase nutrition focus (3 frost tiles) */
  .focus {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }
  .focus__tile {
    background: var(--lab-card);
    border: 1px solid var(--lab-border);
    border-radius: 13px;
    padding: 13px 9px;
    text-align: center;
  }
  .focus__label {
    font-family: 'Marcellus', serif;
    font-size: 17px;
    color: var(--solid);
  }
  .focus__sub {
    font-size: 8.5px;
    color: #A99E88;
    margin-top: 4px;
  }

  /* section label */
  .section-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #A99E88;
    margin: 22px 0 12px;
  }

  /* today's meals */
  .meals {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .meal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--lab-border);
  }
  .meal__slot {
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #BDB39D;
  }
  .meal__name {
    font-family: 'Marcellus', serif;
    font-size: 15.5px;
    margin-top: 2px;
    color: #2C2825;
  }
  .meal__stat {
    font-size: 10.5px;
    color: #6A655D;
    font-weight: 500;
    white-space: nowrap;
  }

  /* macro / nutrient target card (phase solid) */
  .target {
    margin-top: 15px;
    background: var(--solid);
    border-radius: 13px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .target__label {
    font-size: 10.5px;
    color: var(--on-hdr);
    opacity: 0.85;
    font-weight: 300;
  }
  .target__value {
    font-family: 'Marcellus', serif;
    font-size: 16px;
    color: var(--gold);
  }
</style>
</head>
<body>

  <!-- ======================= FUEL · OVULATION ======================= -->
  <main class="fuel">

    <!-- header band -->
    <div class="fuel__header">
      <div class="fuel__header-orbit"></div>
      <div class="fuel__status">
        <span>9:41</span>
        <span class="signal">5G</span>
      </div>
      <div class="fuel__context">Ovulation &middot; Day 14</div>
      <div class="fuel__title">Fuel</div>
      <div class="fuel__tagline">light, fresh, anti-inflammatory</div>
    </div>

    <!-- tinted body -->
    <div class="fuel__body">

      <!-- phase nutrition focus -->
      <div class="focus">
        <div class="focus__tile">
          <div class="focus__label">Fiber</div>
          <div class="focus__sub">clearance</div>
        </div>
        <div class="focus__tile">
          <div class="focus__label">Raw</div>
          <div class="focus__sub">cooling</div>
        </div>
        <div class="focus__tile">
          <div class="focus__label">Zinc</div>
          <div class="focus__sub">egg quality</div>
        </div>
      </div>

      <!-- today's meals -->
      <div class="section-label">Today&rsquo;s meals</div>
      <div class="meals">
        <div class="meal">
          <div>
            <div class="meal__slot">Breakfast</div>
            <div class="meal__name">Berry &amp; flax smoothie</div>
          </div>
          <div class="meal__stat">320 kcal</div>
        </div>
        <div class="meal">
          <div>
            <div class="meal__slot">Lunch</div>
            <div class="meal__name">Rainbow crunch salad</div>
          </div>
          <div class="meal__stat">480 kcal</div>
        </div>
        <div class="meal">
          <div>
            <div class="meal__slot">Dinner</div>
            <div class="meal__name">Grilled salmon &amp; greens</div>
          </div>
          <div class="meal__stat">540 kcal</div>
        </div>
      </div>

      <!-- nutrient target (phase solid card) -->
      <div class="target">
        <span class="target__label">Protein target</span>
        <span class="target__value">98 / 110g</span>
      </div>

    </div>
  </main>

</body>
</html>
